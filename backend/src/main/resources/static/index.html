<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">    <title>FlightOnTime - Operational Dashboard</title>
    <style>
        html {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-orange: #fb7185;
            --text-gray: #94a3b8;
            --white: #f8fafc;
            --input-bg: #334155;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--white);
            /* CAMBIO AQUÍ: min-height permite que crezca, overflow: auto permite scroll */
            min-height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* ---------- NAVBAR ---------- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid #334155;
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { color: var(--accent-blue); font-size: 1.5rem; transform: rotate(-15deg); }
        .dashboard-title { font-weight: 600; letter-spacing: 1px; font-size: 1.1rem; }

        /* ---------- GRID ---------- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 15px;
            padding: 15px;
            flex: 1;
            align-items: stretch;
            /* CAMBIO AQUÍ: Quitar overflow: hidden para que no corte las tarjetas */
        }

        /* ---------- CARDS ---------- */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            /* CAMBIO AQUÍ: min-height asegura que la tarjeta no se colapse */
            min-height: 450px;
            height: 100%;
        }


        .card-header {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-gray);
            margin-bottom: 15px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .card .data-boxes {
            margin-top: auto; /* Empuja los factores al fondo de la tarjeta */
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            flex-shrink: 0;
        }

        /* ---------- FORM ---------- */
        .input-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .input-group {
            margin-bottom: 5px;
        }

        .input-group label {
            font-size: 0.75rem;
            margin-bottom: 2px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-gray);
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid #475569;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
        }

        input:focus {
            outline: 2px solid var(--accent-blue);
            border-color: transparent;
        }

        .btn-predict {
            width: 100%;
            padding: 12px;
            background: #e11d48;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            transition: opacity 0.2s, box-shadow 0.2s;
        }

        .btn-predict:hover { opacity: 0.9; }
        .btn-predict:active { box-shadow: 0 0 0 2px var(--accent-blue); }

        /* ---------- RESULT ---------- */
        .result-display {
            display: none;
            align-items: center;
            gap: 15px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px dashed var(--accent-blue);
            border-radius: 8px;
            margin-top: 15px;
        }

        .res-status-text {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .res-prob {
            color: var(--accent-orange);
            font-size: 0.8rem;
        }

        /* ---------- STATS ---------- */
        .stats-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            height: 100%;
        }

        .circle-stat {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 8px solid var(--accent-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .data-boxes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .data-box {
            background: rgba(15, 23, 42, 0.4);
            padding: 10px;
            border-left: 3px solid var(--accent-blue);
            font-size: 0.75rem;
        }

        /* ---------- ANALYTICS (GRÁFICA + GRANDE / LISTA + CHICA) ---------- */
        .chart-container {
            position: relative;
            width: 100%;
            height: 130px !important; /* Gráfica ligeramente más grande */
            flex-shrink: 0;
            margin-bottom: 8px;
        }

        .top-rutas-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 2px; /* Espacio mínimo entre filas */

            overflow-y: visible;
            max-height: none;
            font-size: 0.7rem; /* Letra más chica y normal */
        }

        .top-rutas-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.4); /* Un toque más sutil */
            padding: 2px 8px; /* Padding vertical mínimo */
            border-left: 2px solid var(--accent-orange);
            border-radius: 4px;
            font-weight: normal; /* Aseguramos que la letra sea normal */
        }

        .top-rutas-list span {
            color: var(--text-gray);
            font-size: 0.65rem; /* El detalle de vuelos aún más discreto */
        }

        /* Ajuste de margen para Factores Clave */
        .card .data-boxes {
            margin-top: 8px;
            padding-top: 4px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 1000px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            body { height: auto; }
        }

        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; padding: 10px; }
            .input-row { flex-direction: column; gap: 0; }
            .circle-stat { width: 100px; height: 100px; font-size: 1.3rem; }
        }

        @media (max-width: 380px) {
            .data-boxes { grid-template-columns: 1fr; }
        }
    </style>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<script>
    /* ===============================
       FORMATEO INPUT HORA
    ================================ */
    const horaInput = document.getElementById("hora");
    if (horaInput) {
        horaInput.addEventListener("input", (e) => {
            let valor = e.target.value.replace(/\D/g, "");
            if (valor.length > 4) valor = valor.slice(0, 4);
            if (valor.length >= 3) valor = valor.slice(0, 2) + ":" + valor.slice(2);
            e.target.value = valor;
        });
    }

    /* ===============================
       MENSAJES DE RESULTADO
    ================================ */
    function showMsg(color, titulo, descripcion) {
        const box = document.getElementById("result-box");
        const t = document.getElementById("res-titulo");
        const d = document.getElementById("res-desc");

        box.style.display = "flex";
        t.textContent = titulo;
        d.textContent = descripcion || "";
        t.style.color = color || "#38bdf8";
    }

    /* ===============================
       FUNCIÓN PRINCIPAL
    ================================ */
    async function predecir() {
        const aerolinea = document.getElementById("aerolinea").value.trim().toUpperCase();
        const origen = document.getElementById("origen").value.trim().toUpperCase();
        const destino = document.getElementById("destino").value.trim().toUpperCase();
        const fecha = document.getElementById("fecha").value;
        const hora = document.getElementById("hora").value.trim();

        if (!aerolinea || !origen || !destino || !fecha || !hora) {
            showMsg("#fb7185", "CAMPOS INCOMPLETOS", "Llena todos los campos");
            return;
        }

        const fechaISO = `${fecha}T${hora}:00`;
        const fechaObj = new Date(fechaISO);
        const departureHour = fechaObj.getHours();
        const dayOfWeek = fechaObj.getDay(); // 0 = domingo


        showMsg(null, "CONSULTANDO...", "Analizando historial real...");

        try {
            const res = await fetch("http://localhost:8080/api/flights/predict-with-stats", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    aerolinea,
                    origen,
                    destino,
                    fecha_partida: `${fecha}T${hora}`
                })
            });

            const json = await res.json();
            if (!res.ok) {
                throw new Error(json.message || "Error en backend");
            }

            /* ===== PREVISIÓN ===== */
            const esPuntual = json.prevision.toLowerCase().includes("tiempo");
            showMsg(
                esPuntual ? "#4ade80" : "#fb7185",
                json.prevision.toUpperCase(),
                ""
            );

            /* ===== CÍRCULO ===== */
            const prob = json.porcentajeRetrasosRuta ?? 0;
            const circulo = document.getElementById("puntualidad-global");
            circulo.textContent = prob.toFixed(1) + "%";

            if (prob <= 40) circulo.style.borderColor = "#4ade80";
            else if (prob <= 70) circulo.style.borderColor = "#f97316";
            else circulo.style.borderColor = "#fb7185";

            /* ===== STATS ===== */
            document.getElementById("total-vuelos").textContent = json.totalVuelosRuta ?? "--";
            document.getElementById("vuelos-retrasados").textContent = json.vuelosRetrasadosRuta ?? "--";

            /* ===== FACTORES CLAVE ===== */
            document.getElementById("factores-clave").innerHTML = `
            <ul style="padding:0; list-style:none;">
                <li>Distancia: <strong>${json.distancia ?? "--"} km</strong></li>
                <li>Ruta: <strong>${origen} → ${destino}</strong></li>

                <li>Probabilidad: <strong>${((json.probabilidad ?? 0) * 100).toFixed(1)}%</strong></li>
                <li>Historial: ${json.recomendacion ?? "Sin datos suficientes"}</li>
            </ul>
        `;

            actualizarGrafica(json);
            cargarTopRutas();

        } catch (err) {
            showMsg("#fb7185", "ERROR", err.message);
            console.error(err);
        }
    }

    /* ===============================
       GRÁFICA LÍNEAS
    ================================ */
    function actualizarGrafica(json) {
        const ctx = document.getElementById("historico-vuelos").getContext("2d");
        if (window.myChart) window.myChart.destroy();

        const datos = json.historialPuntualidad?.length
            ? json.historialPuntualidad
            : [0, 0, 0, json.porcentajeRetrasosRuta ?? 0];

        const etiquetas = json.etiquetasFechas?.length
            ? json.etiquetasFechas
            : ["-3", "-2", "-1", "Hoy"];

        window.myChart = new Chart(ctx, {
            type: "line",
            data: {
                labels: etiquetas,
                datasets: [{
                    data: datos,
                    borderColor: "#38bdf8",
                    backgroundColor: "rgba(56,189,248,0.15)",
                    fill: true,
                    tension: 0.4,
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        ticks: { callback: v => v + "%" }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    /* ===============================
       TOP 5 RUTAS
    ================================ */
    async function cargarTopRutas() {
        try {
            const res = await fetch("http://localhost:8080/api/stats/top-rutas");
            if (!res.ok) throw new Error("Error cargando top rutas");

            const data = await res.json();
            const cont = document.getElementById("top-rutas");
            cont.innerHTML = "";

            if (!data || data.length === 0) {
                cont.innerHTML = "<li style='color:#94a3b8;font-size:0.7rem'>Sin datos disponibles</li>";
                return;
            }

            data.forEach(r => {
                cont.innerHTML += `
                <li>
                    <strong>${r.nombre}</strong>
                    <span>${r.cantidad} vuelos retrasados</span>
                </li>
            `;
            });

        } catch (e) {
            console.error("Top rutas error:", e);
        }
    }


    /* ===============================
       STATS INICIALES
    ================================ */
    async function cargarStats() {
        try {
            const res = await fetch("http://localhost:8080/api/stats/summary");
            const data = await res.json();
            document.getElementById("total-vuelos").textContent = data.totalVuelos;
            document.getElementById("vuelos-retrasados").textContent = data.vuelosRetrasados;
        } catch (e) {
            console.error(e);
        }
    }

    window.onload = () => {
        cargarStats();
        cargarTopRutas();
    };

</script>
