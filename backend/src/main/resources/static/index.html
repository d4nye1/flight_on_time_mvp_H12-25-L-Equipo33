<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlightOnTime - Predicción de Vuelos</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

<header class="navbar">
    <div class="logo">✈ FlightOnTime</div>
</header>

<main class="container">
    <section class="hero">
        <span class="badge">● Sistema de Predicción Activo</span>
        <h1>¿Tu vuelo llegará <span class="highlight">a tiempo?</span></h1>
        <p>Utilizamos modelos de IA para analizar la puntualidad de tu ruta en segundos.</p>
    </section>

    <section class="form-card">
        <h2>Consulta tu vuelo</h2>
        <p class="subtitle">Ingresa códigos IATA oficiales</p>

        <div class="input-group">
            <label>Aerolínea (IATA)</label>
            <input id="aerolinea" maxlength="2" placeholder="Ej: AA" />
        </div>

        <div class="row">
            <div class="input-group">
                <label>Origen</label>
                <input id="origen" maxlength="3" placeholder="Ej: JFK" />
            </div>
            <div class="input-group">
                <label>Destino</label>
                <input id="destino" maxlength="3" placeholder="Ej: MAD" />
            </div>
        </div>

        <div class="input-group">
            <label>Fecha y hora de partida</label>
            <input type="datetime-local" id="fecha" />
        </div>

        <button id="btnPredict" class="btn-predict">✈ Predecir Estado</button>

        <div id="result-box" class="result-card">
            <div class="main-text" id="res-titulo"></div>
            <div class="sub-text" id="res-desc"></div>
        </div>
    </section>
</main>

<script type="module" src="javascript/main.js"></script>
</body>
</html>
