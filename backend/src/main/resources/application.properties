spring.application.name=FlightOnTimeAPI

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datasource persistente
# Agrega esta línea al final de tu archivo actual:
spring.datasource.url=jdbc:h2:file:./data/flightdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging SQL completo
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Pool de conexiones
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false


